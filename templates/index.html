<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>فلترة العملات</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial;
            direction:rtl;
            padding:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            border:1px solid #444;
            padding:10px;
            text-align:center;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }

        select{
            padding:10px;
        }

    </style>

</head>

<body>

    <h1>فلترة Binance Spot</h1>

    <select id="timeframe">
        <option value="15m">15m</option>
        <option value="1h">1h</option>
        <option value="4h">4h</option>
        <option value="1d">1d</option>
    </select>

    <button onclick="scanCoins()">
        ابدأ الفحص
    </button>

    <table>

        <thead>

            <tr>
                <th>العملة</th>
                <th>السعر</th>
                <th>RSI</th>
                <th>Score</th>
            </tr>

        </thead>

        <tbody id="results">

        </tbody>

    </table>

<script>

async function scanCoins(){

    const timeframe =
        document.getElementById("timeframe").value

    const response =
        await fetch(`/scan/${timeframe}`)

    const data =
        await response.json()

    console.log(data)

    const tbody =
        document.getElementById("results")

    tbody.innerHTML = ""

    data.forEach(item => {

        tbody.innerHTML += `

        <tr>
            <td>${item.symbol}</td>
            <td>${item.price}</td>
            <td>${item.rsi}</td>
            <td>${item.score}</td>
        </tr>

        `

    })

}

</script>

</body>
</html>
